name: Ruff
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
